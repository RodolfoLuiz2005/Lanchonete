<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - MK</title>
  <link rel="stylesheet" href="admin-premium.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <span class="eyebrow">Painel premium</span>
      <h1>MK Lanchonete</h1>
      <p>Controle produtos, promoções, pedidos, cozinha, mesas e faturamento em um só lugar.</p>
    </section>
    <form class="login-box" id="login-form">
      <h2>Acessar painel</h2>
      <label>Usuário<input id="login-user" autocomplete="username" placeholder="Usuário" required></label>
      <label>Senha<input id="login-pass" type="password" autocomplete="current-password" placeholder="*****" required></label>
      <button type="submit">Entrar</button>

      <small id="login-error" style="display:none;color:#b91c1c;"></small>
    </form>
  </main>

  <script src="mk-data.js"></script>
  <script>
    if (sessionStorage.getItem('mk_admin_auth') === 'ok' && window.MKStore && typeof MKStore.adminCredentials === 'function') {
      const current = MKStore.adminCredentials();
      const sessionUser = String(sessionStorage.getItem('mk_admin_user') || '').trim().toLowerCase();
      if (sessionUser && sessionUser === String(current.usuario || '').trim().toLowerCase()) {
        location.href = 'admin.html';
      }
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value.trim();
      const errorBox = document.getElementById('login-error');
      if (errorBox) {
        errorBox.style.display = 'none';
        errorBox.textContent = '';
      }

      const ok = (window.MKStore && typeof MKStore.verifyAdminCredentials === 'function')
        ? MKStore.verifyAdminCredentials(username, password)
        : false;

      if (ok) {
        sessionStorage.setItem('mk_admin_auth', 'ok');
        sessionStorage.setItem('mk_admin_user', username);
        location.href = 'admin.html';
        return;
      }

      if (errorBox) {
        errorBox.textContent = 'Usuário ou senha incorretos.';
        errorBox.style.display = 'block';
      } else {
        alert('Usuário ou senha incorretos.');
      }
    });

  </script>
</body>
</html>
