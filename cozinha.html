<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Cozinha - MK</title>
  <link rel="stylesheet" href="cozinha.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="kitchen-locked">
  <main class="kitchen-login" id="kitchen-login" aria-labelledby="kitchen-login-title">
    <form class="kitchen-login-card" id="kitchen-login-form">
      <span>MK Cozinha</span>
      <h1 id="kitchen-login-title">Acesso da cozinha</h1>
      <label>
        Usuário
        <input id="kitchen-user" name="usuario" autocomplete="username" required>
      </label>
      <label>
        Senha
        <input id="kitchen-pass" name="senha" type="password" autocomplete="current-password" required>
      </label>
      <p class="kitchen-login-error" id="kitchen-login-error" role="alert" aria-live="polite"></p>
      <button type="submit">Entrar</button>
    </form>
  </main>

  <header class="kitchen-top">
    <div>
      <span>MK Cozinha</span>
      <h1>Pedidos em preparo</h1>
    </div>
    <div class="top-actions">

      <button id="enable-sound" type="button"><i class="bi bi-volume-up"></i> Ativar som</button>
      <span class="kitchen-sound-status" id="kitchen-sound-status">Som desativado. Clique para ativar notificações sonoras.</span>
      <button id="btn-limpar-finalizados" type="button">
        <i class="bi bi-trash3"></i> Limpar entregues
      </button>
      <button id="kitchen-logout" type="button"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </header>


  <nav class="kitchen-status-tabs" id="kitchen-status-tabs" aria-label="Filtrar pedidos por status">
    <button type="button" class="active" data-filter="todos">Todos <span>0</span></button>
    <button type="button" data-filter="aguardando">Aguardando <span>0</span></button>
    <button type="button" data-filter="preparando">Preparando <span>0</span></button>
    <button type="button" data-filter="pronto">Prontos <span>0</span></button>
    <button type="button" data-filter="entregue">Entregues <span>0</span></button>
    <button type="button" data-filter="cancelado">Cancelados <span>0</span></button>
  </nav>
  <main class="kitchen-board" data-kitchen-filter="todos">
    <section class="k-col" id="aguardando"><h2>Aguardando</h2></section>
    <section class="k-col" id="preparando"><h2>Preparando</h2></section>
    <section class="k-col" id="pronto"><h2>Prontos</h2></section>
    <section class="k-col" id="entregue"><h2>Entregues</h2></section>
    <section class="k-col" id="cancelado"><h2>Cancelados</h2></section>
  </main>

  
</body>
  <script src="mk-data.js"></script>
  <script src="cozinha.js"></script>
</html>
